[project]
name = "tiny-claw"
version = "0.1.0"
description = "Python rewrite of go-tiny-claw — AI agent with Feishu integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-deepseek>=0.1",
    "langgraph>=0.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "langsmith>=0.3",
    "openai>=2.44.0",
    "lark-oapi>=1.4",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = true

[project.scripts]
tiny-claw = "tiny_claw.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 固定临时目录：系统默认位置曾残留其他用户身份创建的 pytest-of-* 目录，
# 导致 tmp_path 创建时报 PermissionError: EEXIST（一次挂掉 19 个用例）。
# 固定到干净路径避免复发，详见 docs 与 .workbuddy/memory。
addopts = "--basetemp=/tmp/tiny-claw-pytest"
